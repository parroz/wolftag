# WolfTag — nginx site config
# Place in /etc/nginx/sites-available/wolftag and symlink to sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/wolftag /etc/nginx/sites-enabled/wolftag
#   sudo nginx -t && sudo systemctl reload nginx
#
# Public access:  https://wolftag.ddns.net   (TLS via Let's Encrypt / certbot)
# LAN access:     http://192.168.1.113        (office, no TLS needed)
# The app is password-protected (APP_PASSWORD); public traffic is forced to HTTPS
# so the password is never sent in clear text.

# ── HTTP: serve ACME renewals, redirect the public domain to HTTPS ──────────────
server {
    listen 80;
    server_name wolftag.ddns.net;

    location /.well-known/acme-challenge/ {
        root /srv/wolftag/dist;   # certbot --webroot drops challenge files here
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTP: LAN access by IP (no redirect — office stays on plain HTTP) ────────────
server {
    listen 80;
    server_name 192.168.1.113;

    root /srv/wolftag/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /api {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 20m;
    }
}

# ── HTTPS: public access via wolftag.ddns.net ───────────────────────────────────
server {
    listen 443 ssl;
    server_name wolftag.ddns.net;

    ssl_certificate     /etc/letsencrypt/live/wolftag.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wolftag.ddns.net/privkey.pem;

    root /srv/wolftag/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /api {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 20m;  # for CSV uploads
    }
}
