# WolfTag — nginx site config
# Place in /etc/nginx/sites-available/wolftag and symlink to sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/wolftag /etc/nginx/sites-enabled/wolftag
#   sudo nginx -t && sudo systemctl reload nginx
#
# Exposed publicly via wolftag.ddns.net (router must forward port 80/443 to this
# host). Also reachable on the LAN at 192.168.1.113. The app itself is protected
# by a password (APP_PASSWORD). STRONGLY recommended: add TLS with certbot so the
# password is not sent in clear text — see notes at the bottom of this file.

server {
    listen 80;
    server_name wolftag.ddns.net 192.168.1.113;

    # Frontend static files (built by: ./scripts/deploy.sh /srv/wolftag/dist)
    root /srv/wolftag/dist;
    index index.html;

    # SPA routing — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for Vite's content-hashed assets
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend Docker container
    location /api {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 20m;  # for CSV uploads
    }
}

# ── Enabling HTTPS (recommended) ────────────────────────────────────────────────
# The login password travels in clear text over plain HTTP. Once the domain
# resolves publicly and ports 80+443 are forwarded to this host, run:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d wolftag.ddns.net
#
# certbot edits this server block to add `listen 443 ssl`, the certificate paths,
# and an HTTP->HTTPS redirect, then auto-renews. Re-run nginx -t && reload after.
