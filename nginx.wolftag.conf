# WolfTag — nginx site config
# Place in /etc/nginx/sites-available/wolftag and symlink to sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/wolftag /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;   # replace with your hostname or IP if needed

    # Frontend static files (built by scripts/deploy.sh)
    root /var/www/wolftag;
    index index.html;

    # SPA routing — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for Vite's content-hashed assets
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend Docker container
    location /api {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 20m;  # for CSV uploads
    }
}
